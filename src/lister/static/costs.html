<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lister Costs</title>
<style>
:root { color-scheme: light; --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #677085; --line: #dde1e8; --accent: #2b6cb0; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #14171c; --panel: #1d2128; --text: #e7eaf0; --muted: #98a1b3; --line: #2e343e; --accent: #5b9be0; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
h1 { font-size: 18px; margin: 0; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
main { max-width: 820px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.tile small { color: var(--muted); }
.tile b { font-size: 24px; font-variant-numeric: tabular-nums; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
h2 { font-size: 15px; margin: 0 0 8px; }
table { width: 100%; border-collapse: collapse; }
td { padding: 6px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
p.note { color: var(--muted); font-size: 13px; margin: 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
{{NAV}}
<header>
  <h1>Claude costs</h1>
  <p>What reading cards with Claude has cost ({{CARDS}} calls so far).</p>
</header>
<main>
  <div class="tiles">{{TILES}}</div>
  <section>
    <h2>By batch</h2>
    <table>{{ROWS}}</table>
  </section>
  <section>
    <h2>By model</h2>
    <table>{{MODELS}}</table>
  </section>
  {{UNPRICED}}
  <p class="note">Estimated from Anthropic's list prices. Your Anthropic Console (Usage and Cost pages) has
    the exact bill. Log: {{LOG}}</p>
</main>
</body>
</html>
