<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>Lister Batches</title>
<style>
:root { --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #677085; --line: #dde1e8; --accent: #2b6cb0;
        --warn: #a15c00; --warn-bg: #fff4e0; --err: #b42318; --err-bg: #fdecea; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #14171c; --panel: #1d2128; --text: #e7eaf0; --muted: #98a1b3; --line: #2e343e; --accent: #5b9be0;
          --warn: #f0b45a; --warn-bg: #3a2c12; --err: #ff8a80; --err-bg: #3d1c1a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
h1 { font-size: 18px; margin: 0; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
main { max-width: 900px; margin: 0 auto; padding: 16px; }
h2 { font-size: 15px; margin: 24px 0 8px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
li { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; gap: 12px; align-items: center; }
li img { width: 48px; border-radius: 3px; flex: none; }
a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
.chip { display: inline-block; margin-top: 4px; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--line); color: var(--muted); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.err { background: var(--err-bg); color: var(--err); }
small { color: var(--muted); }
.problems li { display: block; color: var(--err); background: var(--err-bg); border-color: transparent; }
</style>
</head>
<body>
<header>
  <h1>Lister batches</h1>
  <p>Watching {{INBOX}}. This page refreshes every few seconds.</p>
</header>
<main>
  <ul>
{{ROWS}}
  </ul>
  {{PROBLEMS}}
</main>
</body>
</html>
