<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lister Batches</title>
<style>
:root { color-scheme: light; --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #677085; --line: #dde1e8; --accent: #2b6cb0;
        --warn: #a15c00; --warn-bg: #fff4e0; --err: #b42318; --err-bg: #fdecea; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #14171c; --panel: #1d2128; --text: #e7eaf0; --muted: #98a1b3; --line: #2e343e; --accent: #5b9be0;
          --warn: #f0b45a; --warn-bg: #3a2c12; --err: #ff8a80; --err-bg: #3d1c1a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
h1 { font-size: 18px; margin: 0; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
main { max-width: 900px; margin: 0 auto; padding: 16px; }
h2 { font-size: 15px; margin: 24px 0 8px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
li { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; gap: 12px; align-items: center; }
li img { width: 48px; border-radius: 3px; flex: none; }
a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
.chip { display: inline-block; margin-top: 4px; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--line); color: var(--muted); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.err { background: var(--err-bg); color: var(--err); }
small { color: var(--muted); }
.grow { flex: 1; min-width: 0; }
.activity { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
            margin-bottom: 12px; line-height: 1.8; }
.activity.off { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
.progress { margin-top: 6px; display: grid; gap: 4px; max-width: 420px; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s ease; }
.spin { display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -1px;
        border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .bar span { transition: none; } }
.problems li { display: block; color: var(--err); background: var(--err-bg); border-color: transparent; }
</style>
</head>
<body>
{{NAV}}
<header>
  <h1>Batches</h1>
  <p>Watching {{INBOX}} (<a href="/settings">change</a>). This page updates by itself.</p>
</header>
<main id="live">{{LIVE}}</main>
<script>
// Update the list every 2 seconds without reloading (no flicker, keeps your scroll position).
async function tick() {
  try {
    const r = await fetch("/?partial=1", { cache: "no-store" });
    if (r.ok) document.getElementById("live").innerHTML = await r.text();
  } catch (e) { /* Lister stopped; try again next time */ }
}
setInterval(tick, 2000);
</script>
</body>
</html>
