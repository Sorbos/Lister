[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lister"
version = "0.1.0"
description = "Turn trading-card scans into eBay listings"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "anthropic>=2.8",
    "pydantic>=2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lister = "lister.cli:main"
lister-scan-editor = "lister.editor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lister = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
